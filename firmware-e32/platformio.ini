; Illy Bridge on the LCDWiki 4.0" ESP32-32E (E32R40T / E32N40T), 480x320 ST7796.
; Separate from ../firmware (Freenove FNK0086, ESP32-S3) - that project is not touched.
[env:e32-bridge]
platform = espressif32
board = esp32dev
framework = espidf

monitor_speed = 115200
upload_speed = 460800

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
